apiVersion: v1
kind: ConfigMap
metadata:
  name: zeppelin-server-conf-map
data:
  # 'serviceDomain' is a Domain name to use for accessing Zeppelin UI.
  # Should point IP address of 'zeppelin-server' service.
  #
  # Wildcard subdomain need to be point the same IP address to access service inside of Pod (such as SparkUI).
  # i.e. if service domain is 'local.zeppelin-project.org', DNS configuration should make 'local.zeppelin-project.org' and '*.local.zeppelin-project.org' point the same address.
  #
  # Default value is 'local.zeppelin-project.org' while it points 127.0.0.1 and `kubectl port-forward zeppelin-server` will give localhost to connects.
  # If you have your ingress controller configured to connect to `zeppelin-server` service and have a domain name for it (with wildcard subdomain point the same address), you can replace serviceDomain field with your own domain.
  SERVICE_DOMAIN: "local.zeppelin-project.org:8080"
  ZEPPELIN_K8S_SPARK_CONTAINER_IMAGE: "harbor.ing.vm.pvel.worldl.xpt/main/zeppelin-interpreter-spark:0.12.0"
  ZEPPELIN_K8S_CONTAINER_IMAGE: "harbor.ing.vm.pvel.worldl.xpt/main/zeppelin-interpreter:0.12.0"
  ZEPPELIN_HOME: "/opt/zeppelin"
  ZEPPELIN_SERVER_RPC_PORTRANGE: "12320:12320"
  # default value of 'master' property for spark interpreter.
  SPARK_MASTER: "k8s://https://kubernetes.default.svc"
  # default value of 'SPARK_HOME' property for spark interpreter.
  SPARK_HOME: "/spark"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zeppelin-server-conf
data:
  nginx.conf: |
    error_log /var/log/nginx/error.log debug;
    daemon off;
    worker_processes auto;
    events {
      worker_connections 1024;
    }
    http {
      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }

      # match request domain [port]-[service].[serviceDomain]
      # proxy extra service such as spark-ui
      server {
        listen 80;
        location ~ ^/proxy/(?<svc_port>[0-9]+)-(?<svc_name>[^/]+)(/.*)?$ {

          # --- This is the key rewrite rule ---
          # It takes the original request URI and strips the /proxy/[port]-[service] prefix.
          # The 'break' flag stops processing and internally uses this new URI for the proxy_pass.
          # This is an internal rewrite, not a 302 redirect. The user's browser URL does not change.
          # Example: /proxy/4040-spark-ui/jobs -> /jobs
          rewrite ^/proxy/[^/]+(/.*)$ $1 break;
    
          resolver 127.0.0.1:53 ipv6=off;
    
          # Proxy the request to the correct internal service using the captured variables.
          # The URI passed to the backend is the one modified by the 'rewrite' directive above.
          proxy_pass http://$svc_name.NAMESPACE.svc:$svc_port;
    
          # Standard proxy headers for websockets and preserving host information
          proxy_set_header Host $host;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
    
          # Adjust proxy_redirect to work with the new path-based structure.
          # If the backend sends a redirect to "/", this rule rewrites it to the correct proxy path.
          # Example: Backend redirects to "/jobs", browser gets redirected to "/proxy/4040-spark-ui/jobs"
          #proxy_redirect ~^/(.*)$ /proxy/$svc_port-$svc_name/$1;
          proxy_redirect off;
        }
    
        location / {
          proxy_pass http://localhost:8080;
          proxy_set_header Host $host;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_redirect http://localhost $scheme://SERVICE_DOMAIN;
        }
      }
   
    }
