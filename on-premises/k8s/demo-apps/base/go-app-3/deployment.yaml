apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-go-app-3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-go-app-3
  template:
    metadata:
      labels:
        app: sample-go-app-3
    spec:
      containers:
        - name: sample-go-3
          image: harbor.ing.vm.pvel.worldl.xpt/main/sample-go-app-3:0.44
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
