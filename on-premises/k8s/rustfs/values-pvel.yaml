mode:
  standalone:
    existingClaim:
      dataClaim: rustfs-data

storageclass:
  name: local-path
  dataStorageSize: 400Gi
  logStorageSize: 2Gi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: spnw-intermediate-ca1-issuer
    cert-manager.io/common-name: rustfs.ing.vm.pvel.worldl.xpt
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: rustfs.ing.vm.pvel.worldl.xpt
      paths:
        - path: /
          pathType: Prefix
    - host: pvel-rustfs.worldb.site
      paths:
        - path: /
          pathType: Prefix
  tls:
    enabled: true
    certManager:
      enabled: true
