crds:
  install: true
  keep: true

global:
  domain: argo-cd.ing.vm.pvel.worldl.xpt
  networkPolicy:
    create: true

configs:
  params:
    server.insecure: false

controller:
  replicas: 1
  resources:
    requests:
      memory: 1Gi
    limits:
      memory: 2Gi
  pdb:
    enabled: true
    maxUnavailable: 1

applicationSet:
  replicas: 0

notifications:
  enabled: false

dex:
  enabled: false

repoServer:
  replicas: 1
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 1Gi
  pdb:
    enabled: true
    maxUnavailable: 1

server:
  replicas: 1
  resources:
    requests:
      memory: 1Gi
    limits:
      memory: 2Gi
  pdb:
    enabled: true
    maxUnavailable: 1
  service:
    type: ClusterIP
  certificate:
    enabled: true
    domain: argo-cd.ing.vm.pvel.worldl.xpt
    additionalHosts:
      - pvel-argocd.worldb.site
    issuer:
      group: cert-manager.io
      kind: ClusterIssuer
      name: spnw-intermediate-ca1-issuer
  ingress:
    enabled: true
    controller: generic
    ingressClassName: nginx
    hostname: argo-cd.ing.vm.pvel.worldl.xpt
    path: /
    pathType: ImplementationSpecific
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: HTTPS
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    tls: true
    extraHosts:
      - name: pvel-argocd.worldb.site
        path: /

redis:
  enabled: true
  resources:
    requests:
      cpu: 100m
      ephemeral-storage: 50Mi
      memory: 128Mi
    limits:
      cpu: 150m
      ephemeral-storage: 2Gi
      memory: 192Mi
  pdb:
    enabled: true
    maxUnavailable: 1
