[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "squid-on-premises"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dbt-core>=1.12.0",
    "humanize>=4.16.0",
    "psycopg2-binary>=2.9.12",
    "rich>=15.0.0",
]

[tool.setuptools.packages.find]
where = ["../../src"]
include = [
    "squid",
    "squid.core*",
    "squid.on-premises*",
    "squid.resources*",
]
