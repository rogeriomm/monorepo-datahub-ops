[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "squid-databricks"
version = "0.1.0"
# Databricks Free Edition uses Python 3.12.3
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.40.0",
    "databricks-sdk>=0.117.0",
    "dbt-databricks>=1.12.3",
]

[tool.setuptools.packages.find]
where = ["../../src"]
include = [
    "squid",
    "squid.core*",
    "squid.resources*",
]
