# Single-node development configuration
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}

# Traefik forwards HTTP and terminated HTTPS Web UI requests to port 8080.
http-server.process-forwarded=true
http-server.authentication.allow-insecure-over-http=true

# Direct HTTPS listener for external clients.
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/tls/trino.keystore.p12
http-server.https.keystore.key=${ENV:TRINO_TLS_STORE_PASSWORD}
http-server.https.truststore.path=/etc/trino/tls/trino.truststore.p12
http-server.https.truststore.key=${ENV:TRINO_TLS_STORE_PASSWORD}

# Require a client certificate and use its common name as the Trino user.
http-server.authentication.type=CERTIFICATE
http-server.authentication.certificate.user-mapping.pattern=CN=([^,]+)
web-ui.authentication.type=FIXED
web-ui.user=${ENV:TRINO_CLIENT_NAME}
internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SHARED_SECRET}
