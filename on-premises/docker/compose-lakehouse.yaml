services:
  hive-metastore:
    depends_on:
      startup:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully
      hive-postgres-init:
        condition: service_completed_successfully
    build:
      context: hive-metastore
      args:
        HIVE_VERSION: "${HIVE_VERSION:-4.2.1}"
    image: local/hive-metastore:${HIVE_VERSION:-4.2.1}
    container_name: hive-metastore
    profiles:
      - trino
    restart: unless-stopped
    security_opt:
      - label=disable
    environment:
      AWS_ACCESS_KEY_ID: "${RUSTFS_ACCESS_KEY_ID:-rustfsadmin}"
      AWS_SECRET_ACCESS_KEY: "${RUSTFS_SECRET_ACCESS_KEY:-rustfsadmin}"
      DB_DRIVER: postgres
      HIVE_CUSTOM_CONF_DIR: /etc/hive/postgres/conf
      HIVE_AUX_JARS_PATH: "/opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.4.1.jar,/opt/hadoop/share/hadoop/tools/lib/bundle-2.24.6.jar"
      SERVICE_NAME: metastore
      SERVICE_OPTS: >-
        -Dmetastore.warehouse.dir=s3a://trino-lakehouse
        -Dmetastore.catalog.default=iceberg
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9083'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - hive-metastore-data:/opt/hive/data/warehouse
      - hive-postgres-config:/etc/hive/postgres:ro
      - ./hive-metastore/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      # Hive renders its own configuration from this template on every start.
      - ./hive-metastore/core-site.xml:/opt/hive/conf/core-site.xml.template:ro
    networks:
      - backend

  hive-postgres-init:
    depends_on:
      postgres:
        condition: service_healthy
    image: postgres:18
    profiles:
      - trino
    security_opt:
      - label=disable
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-postgres}"
      POSTGRES_MTLS_ENABLED: "${POSTGRES_MTLS_ENABLED:-true}"
    entrypoint: ["/bin/bash", "/init-postgres.sh"]
    volumes:
      - ./hive-metastore/init-postgres.sh:/init-postgres.sh:ro
      - ./postgres/certificates:/etc/postgresql/tls:ro
      - hive-postgres-config:/etc/hive/postgres
    networks:
      - backend

  hive-metastore-catalog-init:
    depends_on:
      hive-metastore:
        condition: service_healthy
    image: local/hive-metastore:${HIVE_VERSION:-4.2.1}
    profiles:
      - trino
    security_opt:
      - label=disable
    environment:
      DB_DRIVER: postgres
      HIVE_CUSTOM_CONF_DIR: /etc/hive/postgres/conf
    entrypoint: ["/bin/bash", "/init-catalogs.sh"]
    volumes:
      - hive-postgres-config:/etc/hive/postgres:ro
      - ./hive-metastore/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hive-metastore/core-site.xml:/opt/hive/conf/core-site.xml:ro
      - ./hive-metastore/init-catalogs.sh:/init-catalogs.sh:ro
    networks:
      - backend

  hive-server2:
    depends_on:
      hive-metastore:
        condition: service_healthy
      hive-metastore-catalog-init:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully
    image: local/hive-metastore:${HIVE_VERSION:-4.2.1}
    container_name: hive-server2
    profiles:
      - trino
    restart: unless-stopped
    security_opt:
      - label=disable
    environment:
      AWS_ACCESS_KEY_ID: "${RUSTFS_ACCESS_KEY_ID:-rustfsadmin}"
      AWS_SECRET_ACCESS_KEY: "${RUSTFS_SECRET_ACCESS_KEY:-rustfsadmin}"
      HIVE_AUX_JARS_PATH: "/opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.4.1.jar,/opt/hadoop/share/hadoop/tools/lib/bundle-2.24.6.jar"
      IS_RESUME: "true"
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: >-
        -Dhive.metastore.uris=thrift://hive-metastore:9083
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/10000'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - ./hive-metastore/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      # Hive renders its own configuration from this template on every start.
      - ./hive-metastore/core-site.xml:/opt/hive/conf/core-site.xml.template:ro
    networks:
      - backend

  trino:
    depends_on:
      startup:
        condition: service_completed_successfully
      hive-metastore:
        condition: service_healthy
      hive-metastore-catalog-init:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully
    image: trinodb/trino:483
    container_name: trino
    profiles:
      - trino
    user: "1000:0"
    restart: unless-stopped
    security_opt:
      - label=disable
    entrypoint:
      - /bin/bash
      - /etc/trino/configure-tls.sh
    command:
      - /usr/lib/trino/bin/run-trino
    ports:
      - target: 8443
        published: "${TRINO_PORT:-8443}"
        host_ip: "${TRINO_BIND_ADDRESS:-127.0.0.1}"
        protocol: tcp
    environment:
      TRINO_CLIENT_NAME: "${TRINO_CLIENT_NAME:-trino-client}"
      TRINO_CLIENT_STORE_PASSWORD: "${TRINO_CLIENT_STORE_PASSWORD:-changeit}"
      TRINO_HOSTNAME: "${TRINO_HOSTNAME:?TRINO_HOSTNAME must be set}"
      RUSTFS_ACCESS_KEY_ID: "${RUSTFS_ACCESS_KEY_ID:-rustfsadmin}"
      RUSTFS_SECRET_ACCESS_KEY: "${RUSTFS_SECRET_ACCESS_KEY:-rustfsadmin}"
      TRINO_TLS_STORE_PASSWORD: "${TRINO_TLS_STORE_PASSWORD:-changeit}"
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/configure-tls.sh:/etc/trino/configure-tls.sh:ro
      - ./trino/ExportPrivateKey.java:/etc/trino/ExportPrivateKey.java:ro
      - ./trino/certificates:/etc/trino/tls
      - ./Volumes:/Volumes
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          --cacert /etc/trino/tls/ca.crt
          --cert-type P12
          --cert /etc/trino/tls/trino-client.p12
          --pass "$${TRINO_CLIENT_STORE_PASSWORD}"
          --resolve "$${TRINO_HOSTNAME}:8443:127.0.0.1"
          --header "X-Trino-User: $${TRINO_CLIENT_NAME}"
          "https://$${TRINO_HOSTNAME}:8443/v1/info"
          | grep -q '"starting":[[:space:]]*false'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=devcontainer_frontend
      - traefik.http.routers.trino.rule=Host(`trino.localhost`) || Host(`${TRINO_ADDITIONAL_HOSTNAME:-trino.localhost}`)
      - traefik.http.routers.trino.entrypoints=web,websecure
      - traefik.http.routers.trino.middlewares=traefik-basic-auth@docker
      - traefik.http.routers.trino.service=trino
      - traefik.http.services.trino.loadbalancer.server.port=8080
    networks:
      - backend
      - external
      - frontend

  rustfs:
    depends_on:
      startup:
        condition: service_completed_successfully
    image: local/rustfs:1.0.0
    build:
      context: rustfs
      dockerfile: Dockerfile
    container_name: rustfs
    profiles:
      - rustfs
      - s3
      - trino
      - flink
    restart: unless-stopped
    security_opt:
      - label=disable
    ports:
      - target: 9000
        published: "${RUSTFS_S3_PORT:-9000}"
        host_ip: "${RUSTFS_BIND_ADDRESS:-127.0.0.1}"
        protocol: tcp
    environment:
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY_ID:-rustfsadmin}"
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_HOSTNAME: "${RUSTFS_HOSTNAME:?RUSTFS_HOSTNAME must be set}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_ACCESS_KEY:-rustfsadmin}"
      RUSTFS_TLS_PATH: /opt/tls
      RUSTFS_VOLUMES: /data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--cacert", "/opt/tls/ca.crt", "https://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
      - ./rustfs/certificates:/opt/tls
    labels:
      - traefik.enable=true
      - traefik.docker.network=devcontainer_frontend
      - traefik.http.middlewares.rustfs-strip-basic-auth.headers.customrequestheaders.Authorization=
      - traefik.http.routers.rustfs-console-basic-auth.rule=(Host(`rustfs.localhost`) || Host(`${RUSTFS_ADDITIONAL_HOSTNAME:-rustfs.localhost}`)) && HeaderRegexp(`Authorization`, `(?i)^Basic `)
      - traefik.http.routers.rustfs-console-basic-auth.entrypoints=web,websecure
      - traefik.http.routers.rustfs-console-basic-auth.priority=200
      - traefik.http.routers.rustfs-console-basic-auth.middlewares=rustfs-strip-basic-auth
      - traefik.http.routers.rustfs-console-basic-auth.service=rustfs-console
      - traefik.http.routers.rustfs-console.rule=Host(`rustfs.localhost`) || Host(`${RUSTFS_ADDITIONAL_HOSTNAME:-rustfs.localhost}`)
      - traefik.http.routers.rustfs-console.entrypoints=web,websecure
      - traefik.http.routers.rustfs-console.service=rustfs-console
      - traefik.http.services.rustfs-console.loadbalancer.server.port=9001
      - traefik.http.services.rustfs-console.loadbalancer.server.scheme=https
      - traefik.http.services.rustfs-console.loadbalancer.serversTransport=rustfs-tls@file
      - traefik.http.routers.rustfs-s3.rule=Host(`rustfs-s3.localhost`)
      - traefik.http.routers.rustfs-s3.entrypoints=web,websecure
      - traefik.http.routers.rustfs-s3.service=rustfs-s3
      - traefik.http.services.rustfs-s3.loadbalancer.server.port=9000
      - traefik.http.services.rustfs-s3.loadbalancer.server.scheme=https
      - traefik.http.services.rustfs-s3.loadbalancer.serversTransport=rustfs-tls@file
    networks:
      - frontend
      - backend
      - tunnel

  rustfs-http:
    depends_on:
      rustfs:
        condition: service_healthy
    image: nginx:1.29-alpine
    container_name: rustfs-http
    profiles:
      - trino
      - flink
    restart: unless-stopped
    security_opt:
      - label=disable
    volumes:
      - ./rustfs/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend

  rustfs-init:
    depends_on:
      rustfs:
        condition: service_healthy
      rustfs-http:
        condition: service_started
    image: amazon/aws-cli:2.31.22
    container_name: rustfs-init
    profiles:
      - trino
      - flink
    security_opt:
      - label=disable
    environment:
      AWS_ACCESS_KEY_ID: "${RUSTFS_ACCESS_KEY_ID:-rustfsadmin}"
      AWS_DEFAULT_REGION: "${RUSTFS_REGION:-us-east-1}"
      AWS_SECRET_ACCESS_KEY: "${RUSTFS_SECRET_ACCESS_KEY:-rustfsadmin}"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        for bucket in trino-lakehouse delta-lakehouse; do
          aws --endpoint-url https://rustfs:9000 --ca-bundle /opt/tls/ca.crt \
            s3api head-bucket --bucket "$${bucket}" >/dev/null 2>&1 ||
          aws --endpoint-url https://rustfs:9000 --ca-bundle /opt/tls/ca.crt \
            s3api create-bucket --bucket "$${bucket}"
        done
    volumes:
      - ./rustfs/certificates:/opt/tls:ro
    networks:
      - backend
