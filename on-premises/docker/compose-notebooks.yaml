      - traefik.http.routers.spark-connect-4-1.service=spark-connect-4-1
      - traefik.http.services.spark-connect-4-1.loadbalancer.server.port=15002
      - traefik.http.services.spark-connect-4-1.loadbalancer.server.scheme=h2c

    command:
      - bash
      - -lc
      - |
        set -o errexit -o pipefail
        if /home/jovyan/.local/bin/mise ls --missing --no-header | grep -q .; then
          /home/jovyan/.local/bin/mise install
        fi
        eval "$(/home/jovyan/.local/bin/mise activate bash)"
        export JAVA_HOME="$$(dirname "$$(dirname "$$(readlink -f /usr/bin/java)")")"
        cd ~/work ; mise trust --yes .
        exec start-notebook.py --ServerApp.token='' \
          --ServerApp.disable_check_xsrf=True \
          --JupyterMCPServerExtensionApp.open_notebook_in_ui=True \
          --JupyterMCPServerExtensionApp.allowed_jupyter_mcp_tools='notebook_run-all-cells,notebook_get-selected-cell,notebook_select-next,notebook_select-previous,docmanager_open,filebrowser_go-to-path,filebrowser_refresh,filebrowser_toggle-hidden-files,application_toggle-left-area,application_toggle-right-area,application_toggle-presentation-mode,application_set-theme,mainmenu_open-edit,mainmenu_open-file,mainmenu_open-help,documentsearch_start,documentsearch_highlightNext,documentsearch_highlightPrevious'

    volumes:
      # Git repository
      - ../..:/home/jovyan/work
      # IPython kernel configuration and project notebook magics
      - ./jupyter_spark_4_1/ipython-kernel-config.py:/home/jovyan/work/.ipython/profile_default/ipython_kernel_config.py:ro
      # Kafka development CA certificate
      - ./kafka-4/certificates:/etc/kafka/tls:ro
      # seaweedfs development CA certificate
      - ./seaweedfs/certificates:/etc/seaweedfs/tls
      # Docker socket
      - /var/run/docker.sock:/var/run/docker.sock
      # AWS CLI
      - ${HOME}/.aws:/home/jovyan/.aws:ro
      - ${HOME}/.aws/login/cache:/home/jovyan/.aws/login/cache:rw
      # Databricks CLI
      - ${HOME}/.databrickscfg:/home/jovyan/.databrickscfg:rw
      - ${HOME}/.databricks:/home/jovyan/.databricks:rw
      - ./Volumes:/Volumes
      # Maven cache, Spark build
      - $HOME/.m2:/home/jovyan/.m2:z

    networks:
      - frontend
      - backend
      - external

