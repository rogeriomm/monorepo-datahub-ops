      secrets:
        - GITHUB_TOKEN

    container_name: jupyter_spark_4_1

    environment:
      - JUPYTER_ENABLE_LAB=yes
      - IPYTHONDIR=/home/jovyan/work/.ipython
      - JUPYTER_SERVICE_NAME=jupyter-spark-4.1
      - TRAEFIK_HTTP_PORT=${TRAEFIK_HTTP_PORT:-8080}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AWS_REGION=${AWS_REGION:-}
      - SEAWEEDFS_ACCESS_KEY_ID=${SEAWEEDFS_ACCESS_KEY_ID:-admin}
      - SEAWEEDFS_SECRET_ACCESS_KEY=${SEAWEEDFS_SECRET_ACCESS_KEY:-secret}
