server {
    listen 9000;
    client_max_body_size 0;

    location / {
        proxy_pass https://rustfs:9000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_ssl_verify off;
        proxy_set_header Host $http_host;
        proxy_pass_request_headers on;
        proxy_request_buffering off;
    }
}
