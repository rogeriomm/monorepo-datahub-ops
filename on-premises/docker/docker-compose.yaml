      - traefik.http.routers.jupyter-spark-4-1-spark-prefixed-static.service=jupyter-spark-4-1-spark-ui
      - traefik.http.routers.jupyter-spark-4-1-spark-prefixed-static.middlewares=jupyter-spark-4-1-spark-ui-strip-prefix
      - traefik.http.routers.jupyter-spark-4-1-spark-static.rule=Host(`jupyter-spark-4-1.localhost`) && PathRegexp(`^/static/(bootstrap|vis-timeline|webui|timeline-view|sorttable|jquery-3\\.5\\.1|initialize-tooltips|table|log-view|scroll-button|dataTables|d3|dagre-d3|graphlib-dot|jquery\\.(blockUI|cookies|dataTables|mustache)|spark-dag-viz|spark-logo).*`)
      - traefik.http.routers.jupyter-spark-4-1-spark-static.entrypoints=web
      - traefik.http.routers.jupyter-spark-4-1-spark-static.priority=300
      - traefik.http.routers.jupyter-spark-4-1-spark-static.middlewares=jupyter-spark-4-1-spark-static-redirect
      - traefik.http.routers.jupyter-spark-4-1-spark-static.service=noop@internal
      - traefik.http.services.jupyter-spark-4-1-spark-ui.loadbalancer.server.port=4042
      - traefik.http.middlewares.jupyter-spark-4-1-spark-pages-redirect.redirectregex.regex=^http://([^/]+)/(jobs|stages|storage|environment|executors|SQL|api/v1)(.*)
      - traefik.http.middlewares.jupyter-spark-4-1-spark-pages-redirect.redirectregex.replacement=http://$${1}/webui/$${2}$${3}
      - traefik.http.middlewares.jupyter-spark-4-1-spark-pages-redirect.redirectregex.permanent=false
      - traefik.http.middlewares.jupyter-spark-4-1-spark-static-redirect.redirectregex.regex=^http://([^/]+)/static/(.*)
      - traefik.http.middlewares.jupyter-spark-4-1-spark-static-redirect.redirectregex.replacement=http://$${1}/webui/static/$${2}
      - traefik.http.middlewares.jupyter-spark-4-1-spark-static-redirect.redirectregex.permanent=false
      - traefik.http.middlewares.jupyter-spark-4-1-spark-ui-strip-prefix.stripprefix.prefixes=/webui
      - traefik.http.routers.spark-connect-4-1.rule=Host(`spark-connect-4-1.localhost`)
      - traefik.http.routers.spark-connect-4-1.entrypoints=web
      - traefik.http.routers.spark-connect-4-1.service=spark-connect-4-1
      - traefik.http.services.spark-connect-4-1.loadbalancer.server.port=15002
      - traefik.http.services.spark-connect-4-1.loadbalancer.server.scheme=h2c

    command:
      - bash
      - -lc
      - |
        set -o errexit -o pipefail
        if /home/jovyan/.local/bin/mise ls --missing --no-header | grep -q .; then
          /home/jovyan/.local/bin/mise install
        fi
        eval "$(/home/jovyan/.local/bin/mise activate bash)"
        exec start-notebook.py --ServerApp.token=''

    volumes:
      # Git repository
      - ../..:/home/jovyan/work
      # IPython kernel configuration and project notebook magics
      - ./jupyter_spark_4_1/ipython-kernel-config.py:/home/jovyan/work/.ipython/profile_default/ipython_kernel_config.py:ro
      # Kafka development CA certificate
      - ./kafka-4/certificates:/etc/kafka/tls:ro
      # seaweedfs development CA certificate
      - ./seaweedfs/certificates:/etc/seaweedfs/tls
      # Docker socket
      - /var/run/docker.sock:/var/run/docker.sock
      # AWS CLI
      - ${HOME}/.aws:/home/jovyan/.aws:ro
      - ${HOME}/.aws/login/cache:/home/jovyan/.aws/login/cache:rw
      # Databricks CLI
      - ${HOME}/.databrickscfg:/home/jovyan/.databrickscfg:rw
      - ${HOME}/.databricks:/home/jovyan/.databricks:rw
      - ./Volumes:/Volumes

    networks:
