      - backend
      - external

  jupyter-spark-4.2:
    image: local/jupyter-pyspark:4.2.0

    build:
      context: jupyter_spark_4_2
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: local/jupyter-pyspark-base:4.2.0
