      args:
        BASE_IMAGE: local/jupyter-pyspark-base:4.1.3
        SCALA_VERSION: "2.13.17"
      secrets:
        - GITHUB_TOKEN

    container_name: jupyter_spark_4_1

    environment:
      - JUPYTER_ENABLE_LAB=yes
      - IPYTHONDIR=/home/jovyan/work/.ipython
      - JUPYTER_SERVICE_NAME=jupyter-spark-4.1
      - TRAEFIK_HTTP_PORT=${TRAEFIK_HTTP_PORT:-8080}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AWS_REGION=${AWS_REGION:-}
      - DATABRICKS_AUTH_STORAGE=plaintext
      - AWS_CONFIG_FILE=/home/jovyan/.aws/config
      - AWS_LOGIN_CACHE_DIRECTORY=/home/jovyan/.aws/login/cache

    profiles:
      - jupyter_spark_4_1

    restart: unless-stopped

    security_opt:
      - label=disable

    labels:
      - traefik.enable=true
      - traefik.docker.network=devcontainer_frontend
      - traefik.http.routers.jupyter-spark-4-1.rule=Host(`jupyter-spark-4-1.localhost`)
      - traefik.http.routers.jupyter-spark-4-1.entrypoints=web
      - traefik.http.routers.jupyter-spark-4-1.priority=100
