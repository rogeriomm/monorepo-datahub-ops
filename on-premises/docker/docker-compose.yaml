    profiles:
      - jupyter_spark_4_2

    restart: unless-stopped

    security_opt:
      - label=disable

    labels:
      - traefik.enable=true
      - traefik.http.routers.jupyter-spark-4-2.rule=Host(`jupyter-spark-4-2.localhost`)
      - traefik.http.routers.jupyter-spark-4-2.entrypoints=web
      - traefik.http.routers.jupyter-spark-4-2.priority=100
      - traefik.http.routers.jupyter-spark-4-2.service=jupyter-spark-4-2
      - traefik.http.services.jupyter-spark-4-2.loadbalancer.server.port=8888
      - traefik.http.routers.jupyter-spark-4-2-spark-ui.rule=Host(`jupyter-spark-4-2.localhost`) && PathPrefix(`/webui`)
      - traefik.http.routers.jupyter-spark-4-2-spark-ui.entrypoints=web
      - traefik.http.routers.jupyter-spark-4-2-spark-ui.priority=300
      - traefik.http.routers.jupyter-spark-4-2-spark-ui.service=jupyter-spark-4-2-spark-ui
      - traefik.http.routers.jupyter-spark-4-2-spark-ui.middlewares=jupyter-spark-4-2-spark-ui-strip-prefix
      - traefik.http.routers.jupyter-spark-4-2-spark-pages.rule=Host(`jupyter-spark-4-2.localhost`) && (PathPrefix(`/jobs`) || PathPrefix(`/stages`) || PathPrefix(`/storage`) || PathPrefix(`/environment`) || PathPrefix(`/executors`) || PathPrefix(`/SQL`) || PathPrefix(`/api/v1`))
      - traefik.http.routers.jupyter-spark-4-2-spark-pages.entrypoints=web
      - traefik.http.routers.jupyter-spark-4-2-spark-pages.priority=300
      - traefik.http.routers.jupyter-spark-4-2-spark-pages.middlewares=jupyter-spark-4-2-spark-pages-redirect
      - traefik.http.routers.jupyter-spark-4-2-spark-pages.service=noop@internal
      - traefik.http.routers.jupyter-spark-4-2-spark-prefixed-static.rule=Host(`jupyter-spark-4-2.localhost`) && PathRegexp(`^/webui/static/(bootstrap|vis-timeline|webui|timeline-view|sorttable|jquery-3\\.5\\.1|initialize-tooltips|table|log-view|scroll-button|dataTables|d3|dagre-d3|graphlib-dot|jquery\\.(blockUI|cookies|dataTables|mustache)|spark-dag-viz|spark-logo).*`)
      - traefik.http.routers.jupyter-spark-4-2-spark-prefixed-static.entrypoints=web
      - traefik.http.routers.jupyter-spark-4-2-spark-prefixed-static.priority=400
      - traefik.http.routers.jupyter-spark-4-2-spark-prefixed-static.service=jupyter-spark-4-2-spark-ui
      - traefik.http.routers.jupyter-spark-4-2-spark-prefixed-static.middlewares=jupyter-spark-4-2-spark-ui-strip-prefix
      - traefik.http.routers.jupyter-spark-4-2-spark-static.rule=Host(`jupyter-spark-4-2.localhost`) && PathRegexp(`^/static/(bootstrap|vis-timeline|webui|timeline-view|sorttable|jquery-3\\.5\\.1|initialize-tooltips|table|log-view|scroll-button|dataTables|d3|dagre-d3|graphlib-dot|jquery\\.(blockUI|cookies|dataTables|mustache)|spark-dag-viz|spark-logo).*`)
      - traefik.http.routers.jupyter-spark-4-2-spark-static.entrypoints=web
      - traefik.http.routers.jupyter-spark-4-2-spark-static.priority=300
      - traefik.http.routers.jupyter-spark-4-2-spark-static.middlewares=jupyter-spark-4-2-spark-static-redirect
      - traefik.http.routers.jupyter-spark-4-2-spark-static.service=noop@internal
      - traefik.http.services.jupyter-spark-4-2-spark-ui.loadbalancer.server.port=4042
      - traefik.http.middlewares.jupyter-spark-4-2-spark-pages-redirect.redirectregex.regex=^http://([^/]+)/(jobs|stages|storage|environment|executors|SQL|api/v1)(.*)
      - traefik.http.middlewares.jupyter-spark-4-2-spark-pages-redirect.redirectregex.replacement=http://$${1}/webui/$${2}$${3}
      - traefik.http.middlewares.jupyter-spark-4-2-spark-pages-redirect.redirectregex.permanent=false
      - traefik.http.middlewares.jupyter-spark-4-2-spark-static-redirect.redirectregex.regex=^http://([^/]+)/static/(.*)
      - traefik.http.middlewares.jupyter-spark-4-2-spark-static-redirect.redirectregex.replacement=http://$${1}/webui/static/$${2}
      - traefik.http.middlewares.jupyter-spark-4-2-spark-static-redirect.redirectregex.permanent=false
      - traefik.http.middlewares.jupyter-spark-4-2-spark-ui-strip-prefix.stripprefix.prefixes=/webui
      - traefik.http.routers.spark-connect-4-2.rule=Host(`spark-connect-4-2.localhost`)
      - traefik.http.routers.spark-connect-4-2.entrypoints=web
      - traefik.http.routers.spark-connect-4-2.service=spark-connect-4-2
      - traefik.http.services.spark-connect-4-2.loadbalancer.server.port=15002
      - traefik.http.services.spark-connect-4-2.loadbalancer.server.scheme=h2c

    command:
      - bash
      - -lc
      - |
        set -o errexit -o pipefail
        if /home/jovyan/.local/bin/mise ls --missing --no-header | grep -q .; then
          /home/jovyan/.local/bin/mise install
        fi
        eval "$(/home/jovyan/.local/bin/mise activate bash)"
        exec start-notebook.py --ServerApp.token=''

    volumes:
      - ../..:/home/jovyan/work
      # Kafka development CA certificate
      - ./kafka-4/certificates:/etc/kafka/tls:ro
      # seaweedfs development CA certificate
      - ./seaweedfs/certificates:/etc/seaweedfs/tls
      # Docker socket
      - /var/run/docker.sock:/var/run/docker.sock
      # AWS CLI
      - ${HOME}/.aws:/home/jovyan/.aws:ro
      - ${HOME}/.aws/login/cache:/home/jovyan/.aws/login/cache:rw
      # Databricks CLI
      - ${HOME}/.databrickscfg:/home/jovyan/.databrickscfg:rw
      - ${HOME}/.databricks:/home/jovyan/.databricks:rw
      - ./Volumes:/Volumes

    networks:
      - frontend
      - backend

  jupyter-glue-5:
    build:
      context: jupyter_spark_glue_5
      dockerfile: Dockerfile
      args:
        SCALA_VERSION: "2.12.18"

    container_name: jupyter-glue-5

    environment:
      - JUPYTER_SERVICE_NAME=jupyter-glue-5
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AWS_REGION=${AWS_REGION:-}
    profiles:
      - jupyter_spark_glue_5
    restart: unless-stopped
    security_opt:
      - label=disable
    entrypoint: []
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --ServerApp.token=
      - --ServerApp.password=
      - --notebook-dir=/home/hadoop/work
    volumes:
      - ../../notebooks/jupyter:/home/hadoop/work
      # Docker socket
      - /var/run/docker.sock:/var/run/docker.sock
      - ./Volumes:/Volumes
    labels:
      - traefik.enable=true
      - traefik.http.routers.jupyter-glue-5.rule=Host(`jupyter-glue-5.localhost`)
      - traefik.http.routers.jupyter-glue-5.entrypoints=web
      - traefik.http.services.jupyter-glue-5.loadbalancer.server.port=8888
    networks:
      - frontend
      - backend

  # https://zeppelin.apache.org/docs/0.12.1/quickstart/docker.html
  zeppelin-0.12.1:
    build:
      context: zeppelin
      dockerfile: Dockerfile
    environment:
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    container_name: zeppelin_0_12_1
    profiles:
      - zeppelin_0_12_1
    restart: unless-stopped
    security_opt:
      - label=disable
    #ports:
    #  - "${ZEPPELIN_PORT:-6661}:8080"
    labels:
      - traefik.enable=true
      - traefik.http.routers.zeppelin.rule=Host(`zeppelin.localhost`)
      - traefik.http.routers.zeppelin.entrypoints=web
      - traefik.http.services.zeppelin.loadbalancer.server.port=8080
    volumes:
      - ../../notebooks/zeppelin:/notebooks
      # Docker socket
      - /var/run/docker.sock:/var/run/docker.sock
      - ./Volumes:/Volumes
    networks:
      - frontend
      - backend

  # https://docs.localstack.cloud/aws/getting-started/installation/
  localstack:
    container_name: '${LOCALSTACK_DOCKER_NAME:-localstack-main}'
    profiles:
      - localstack
    image: localstack/localstack-pro # required for Pro
    #ports:
      #- '127.0.0.1:4566:4566' # LocalStack Gateway
      #- '127.0.0.1:4510-4559:4510-4559' # external services port range
      #- '127.0.0.1:443:443' # LocalStack HTTPS Gateway (Pro)
    environment:
      # Activate LocalStack for AWS: https://docs.localstack.cloud/getting-started/auth-token/
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?} # required for Pro
      # LocalStack configuration: https://docs.localstack.cloud/references/configuration/
      - DEBUG=${DEBUG:-0}
      - PERSISTENCE=${PERSISTENCE:-0}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - '${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack'
      - '/var/run/docker.sock:/var/run/docker.sock'
    networks:
      - backend

  postgres:
    image: postgres:18
    container_name: postgres
    profiles:
      - postgres
    restart: unless-stopped
    security_opt:
      - label=disable
    ports:
      - target: 5432
        published: "${POSTGRES_PORT:-5432}"
        host_ip: "${POSTGRES_BIND_ADDRESS:-127.0.0.1}"
        protocol: tcp
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-postgres}"
      POSTGRES_HOSTNAME: "${POSTGRES_HOSTNAME:-localhost}"
      POSTGRES_CLIENT_STORE_PASSWORD: "${POSTGRES_CLIENT_STORE_PASSWORD:-changeit}"
      POSTGRES_MTLS_ENABLED: "${POSTGRES_MTLS_ENABLED:-true}"
    entrypoint:
      - /bin/bash
      - /etc/postgresql/configure-tls.sh
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/run/postgresql/tls/server.key
      - -c
      - ssl_ca_file=/etc/postgresql/tls/ca.crt
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/var/run/postgresql/tls/pg_hba.conf
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ "$${POSTGRES_MTLS_ENABLED}" = "true" ]; then
            export PGSSLCERT=/etc/postgresql/tls/client.crt;
            export PGSSLKEY=/var/run/postgresql/tls/client.key;
          else
            export PGPASSWORD="$${POSTGRES_PASSWORD}";
          fi;
          PGCONNECT_TIMEOUT=5
          PGSSLMODE=verify-full
          PGSSLROOTCERT=/etc/postgresql/tls/ca.crt
          psql
          --host=postgres
          --username="$${POSTGRES_USER}"
          --dbname="$${POSTGRES_DB}"
          --no-password
          --tuples-only
          --command='SELECT 1'
          | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/configure-tls.sh:/etc/postgresql/configure-tls.sh:ro
      - ./postgres/certificates:/etc/postgresql/tls
    networks:
      - backend
      - tunnel
      - external

  kafka-4:
    image: local/kafka:4.1.0
    build:
      context: kafka-4
      dockerfile: Dockerfile
    container_name: kafka-4
    profiles:
      - kafka
    restart: unless-stopped
    security_opt:
      - label=disable
    ports:
      - target: 9092
        published: "${KAFKA_4_PORT:-9092}"
        host_ip: "${KAFKA_4_BIND_ADDRESS:-127.0.0.1}"
        protocol: tcp
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-4:29093
      KAFKA_LISTENERS: INTERNAL://:29092,SSL://:${KAFKA_4_PORT:-9092},CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-4-backend:29092,SSL://${KAFKA_HOSTNAME:?KAFKA_HOSTNAME must be set}:${KAFKA_4_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SSL,SSL:SSL,CONTROLLER:SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_HOSTNAME: "${KAFKA_HOSTNAME:?KAFKA_HOSTNAME must be set}"
      KAFKA_SSL_KEYSTORE_FILENAME: kafka.keystore.p12
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore-password
      KAFKA_SSL_KEY_CREDENTIALS: key-password
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka.truststore.p12
      KAFKA_SSL_TRUSTSTORE_PASSWORD: "${KAFKA_TLS_STORE_PASSWORD:-changeit}"
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_CLIENT_AUTH: none
      KAFKA_SSL_ENABLED_PROTOCOLS: TLSv1.2,TLSv1.3
      KAFKA_TLS_STORE_PASSWORD: "${KAFKA_TLS_STORE_PASSWORD:-changeit}"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka-4:29092 --command-config /etc/kafka/secrets/client.properties >/dev/null
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./kafka-4/certificates:/etc/kafka/secrets
    networks:
      external:
        aliases:
          - kafka-4-external
      backend:
        aliases:
          - kafka-4-backend
      tunnel:
        aliases:
          - kafka-4-tunnel

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    profiles:
      - kafka
    restart: unless-stopped
    security_opt:
      - label=disable
    depends_on:
      kafka-4:
        condition: service_healthy
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-4:29092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SSL
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_LOCATION: /etc/kafka/tls/kafka.truststore.p12
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_PASSWORD: "${KAFKA_TLS_STORE_PASSWORD:-changeit}"
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_TYPE: PKCS12
    volumes:
      - ./kafka-4/certificates:/etc/kafka/tls:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.kafka-ui.rule=Host(`kafka-ui.localhost`)
      - traefik.http.routers.kafka-ui.entrypoints=web
      - traefik.http.services.kafka-ui.loadbalancer.server.port=8080
    networks:
      - frontend
      - backend

  seaweedfs:
    image: local/seaweedfs:4.39
    build:
      context: seaweedfs
      dockerfile: Dockerfile
    container_name: seaweedfs
    profiles:
      - seaweedfs
      - s3
    restart: unless-stopped
    security_opt:
      - label=disable
    command: >-
      server -dir=/data -filer -s3 -ip=seaweedfs -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024
      -s3.cert.file=/etc/seaweedfs/tls/server.crt
      -s3.key.file=/etc/seaweedfs/tls/server.key
    ports:
      - target: 8333
        published: "${SEAWEEDFS_S3_PORT:-8333}"
        host_ip: "${SEAWEEDFS_BIND_ADDRESS:-0.0.0.0}"
        protocol: tcp
    environment:
      AWS_ACCESS_KEY_ID: "${SEAWEEDFS_ACCESS_KEY_ID:-admin}"
      AWS_SECRET_ACCESS_KEY: "${SEAWEEDFS_SECRET_ACCESS_KEY:-secret}"
      SEAWEEDFS_HOSTNAME: "${SEAWEEDFS_HOSTNAME:?SEAWEEDFS_HOSTNAME must be set}"
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/certificates:/etc/seaweedfs/tls
    labels:
      - traefik.enable=true
      - traefik.http.routers.seaweedfs-master.rule=Host(`seaweedfs-master.localhost`)
      - traefik.http.routers.seaweedfs-master.entrypoints=web
      - traefik.http.routers.seaweedfs-master.service=seaweedfs-master
      - traefik.http.services.seaweedfs-master.loadbalancer.server.port=9333
      - traefik.http.routers.seaweedfs-filer.rule=Host(`seaweedfs-filer.localhost`)
      - traefik.http.routers.seaweedfs-filer.entrypoints=web
      - traefik.http.routers.seaweedfs-filer.service=seaweedfs-filer
      - traefik.http.services.seaweedfs-filer.loadbalancer.server.port=8888
      - traefik.http.routers.seaweedfs-s3.rule=Host(`seaweedfs-s3.localhost`)
      - traefik.http.routers.seaweedfs-s3.entrypoints=web
      - traefik.http.routers.seaweedfs-s3.service=seaweedfs-s3
      - traefik.http.services.seaweedfs-s3.loadbalancer.server.port=8333
      - traefik.http.services.seaweedfs-s3.loadbalancer.server.scheme=https
      - traefik.http.services.seaweedfs-s3.loadbalancer.serversTransport=seaweedfs-s3-tls@file
    networks:
      - frontend
      - backend
      - tunnel

secrets:
  GITHUB_TOKEN:
    environment: GITHUB_TOKEN

volumes:
  airflow-2-11-data:
  airflow-data:
  kafka-data:
  postgres-data:
  seaweedfs-data:
  ssh-tunnel-config:

# https://docs.docker.com/compose/how-tos/networking/
networks:
  frontend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
  external:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
  backend:
    internal: true   # No external connectivity
  tunnel:
    internal: true   # No external connectivity
