# https://containers.dev/guide/dockerfile
name: devcontainer

services:
  traefik:
    image: traefik:v3.7.6
    container_name: traefik
    profiles:
      - airflow
      - jupyter_spark_3_5
      - jupyter_spark_4_1
      - jupyter_spark_4_2
      - jupyter_spark_glue_5
      - kafka
      - seaweedfs
      - trino
      - zeppelin_0_12_1
    restart: unless-stopped
    security_opt:
      - label=disable
    command:
      - --entrypoints.web.address=:80
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/dynamic/seaweedfs-tls.yaml
      - --api.dashboard=true
    ports:
      - "${TRAEFIK_HTTP_PORT:-8080}:80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik-dashboard.rule=Host(`traefik.localhost`)
      - traefik.http.routers.traefik-dashboard.entrypoints=web
      - traefik.http.routers.traefik-dashboard.service=api@internal
      - traefik.http.routers.traefik-dashboard-localhost.rule=Host(`localhost`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
      - traefik.http.routers.traefik-dashboard-localhost.entrypoints=web
      - traefik.http.routers.traefik-dashboard-localhost.service=api@internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/seaweedfs-tls.yaml:/etc/traefik/dynamic/seaweedfs-tls.yaml:ro
    networks:
      - backend
      - frontend

  tools:
    build:
      context: swiss-knife-tools
      dockerfile: Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
        DOCKER_GID: 960
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AWS_REGION=${AWS_REGION:-}
    container_name: tool
    restart: unless-stopped
    security_opt:
      - label=disable
    ports:
      # Java debug port
      - "5005:5005"
      # SSH server
      - "9022:22"
    # mount a local directory
    volumes:
      - ../..:/workspaces:cached
      - $HOME/data:/data:z
      # SSH configuration
      - $HOME/.ssh:/home/ubuntu/.ssh:z
      # Maven cache, Spark build
      - $HOME/.m2:/home/ubuntu/.m2:z
      # mise cache
      - $HOME/.local/share/mise:/home/ubuntu/.local/share/mise:z
      # TMUX configuration
      - $HOME/.tmux.conf:/home/ubuntu/.tmux.conf:z
      - $HOME/.tmux:/home/ubuntu/.tmux:z
      # Dot config directory
      - $HOME/.config:/home/ubuntu/.config:z
      # Docker socket
      - /var/run/docker.sock:/var/run/docker.sock
      # Kafka development CA certificate
      - ./kafka-4/certificates:/etc/kafka/tls:ro
      # JetBrains crack
      - /opt/jetbrains/agent.jar:/opt/jetbrains/agent.jar:ro
      # AWS Cli
      - ${HOME}/.aws:/home/ubuntu/.aws:ro
      - ${HOME}/.aws/login/cache:/home/ubuntu/.aws/login/cache:rw
      - ./Volumes:/Volumes
    networks:
      frontend:
        aliases:
          - tools-frontend
      backend:
        aliases:
          - tools-backend
      tunnel:
        aliases:
          - tools
      external:

  ssh-tunnel:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: ssh-tunnel
    profiles:
      - ssh
    restart: unless-stopped
    security_opt:
      - label=disable
    environment:
      - PUID=${UID:-1000}
      - PGID=${GID:-1000}
      - USER_NAME=tunnel
      - "PUBLIC_KEY=${SSH_TUNNEL_PUBLIC_KEY:?Set SSH_TUNNEL_PUBLIC_KEY in on-premises/docker/.env}"
      - PASSWORD_ACCESS=false
      - SUDO_ACCESS=false
      - LOG_STDOUT=true
    ports:
      - "127.0.0.1:${SSH_TUNNEL_PORT:-9023}:2222"
    volumes:
      - ssh-tunnel-config:/config
    networks:
      - backend
      - external

  trino:
    image: trinodb/trino:latest
    container_name: trino
    profiles:
      - trino
    restart: unless-stopped
    security_opt:
      - label=disable
    entrypoint:
      - /bin/bash
      - /etc/trino/configure-tls.sh
    command:
      - /usr/lib/trino/bin/run-trino
    ports:
      - target: 8443
        published: "${TRINO_PORT:-8443}"
        host_ip: "${TRINO_BIND_ADDRESS:-127.0.0.1}"
        protocol: tcp
    environment:
      TRINO_CLIENT_NAME: "${TRINO_CLIENT_NAME:-trino-client}"
      TRINO_CLIENT_STORE_PASSWORD: "${TRINO_CLIENT_STORE_PASSWORD:-changeit}"
      TRINO_HOSTNAME: "${TRINO_HOSTNAME:?TRINO_HOSTNAME must be set}"
      TRINO_TLS_STORE_PASSWORD: "${TRINO_TLS_STORE_PASSWORD:-changeit}"
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/configure-tls.sh:/etc/trino/configure-tls.sh:ro
      - ./trino/certificates:/etc/trino/tls
      - ./Volumes:/Volumes
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          --cacert /etc/trino/tls/ca.crt
          --cert-type P12
          --cert /etc/trino/tls/trino-client.p12
          --pass "$${TRINO_CLIENT_STORE_PASSWORD}"
          --resolve "$${TRINO_HOSTNAME}:8443:127.0.0.1"
          --header "X-Trino-User: $${TRINO_CLIENT_NAME}"
          "https://$${TRINO_HOSTNAME}:8443/v1/info"
          | grep -q '"starting":[[:space:]]*false'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
      - external

  # https://airflow.apache.org/docs/apache-airflow/stable/start.html
  airflow-3.3:
    image: local/airflow:3.3.0
    build:
      context: airflow-3.3
      dockerfile: Dockerfile
    container_name: airflow-3.3
    profiles:
      - airflow
    restart: unless-stopped
    security_opt:
      - label=disable
    command: standalone
    environment:
      AIRFLOW__API__BASE_URL: "http://airflow-3-3.localhost:${TRAEFIK_HTTP_PORT:-8080}"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - airflow-data:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags:ro
      - ../../notebooks/jupyter:/opt/airflow/notebooks:ro
      - ./Volumes:/Volumes
    labels:
      - traefik.enable=true
      - traefik.http.routers.airflow-3-3.rule=Host(`airflow-3-3.localhost`)
      - traefik.http.routers.airflow-3-3.entrypoints=web
      - traefik.http.services.airflow-3-3.loadbalancer.server.port=8080
    networks:
      - frontend
      - backend

  airflow-2.11:
    image: local/airflow:2.11.2
    build:
      context: airflow-2.11
      dockerfile: Dockerfile
    container_name: airflow-2.11
    profiles:
      - airflow
    restart: unless-stopped
    security_opt:
      - label=disable
    command:
      - bash
      - -c
      - |
        rm -f /opt/airflow/airflow-webserver.pid
        exec airflow standalone
    environment:
      AIRFLOW__WEBSERVER__BASE_URL: "http://airflow-2-11.localhost:${TRAEFIK_HTTP_PORT:-8080}"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - airflow-2-11-data:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags:ro
      - ../../notebooks/jupyter:/opt/airflow/notebooks:ro
      - ./Volumes:/Volumes
    labels:
      - traefik.enable=true
      - traefik.http.routers.airflow-2-11.rule=Host(`airflow-2-11.localhost`)
      - traefik.http.routers.airflow-2-11.entrypoints=web
      - traefik.http.services.airflow-2-11.loadbalancer.server.port=8080
    networks:
      - frontend
      - backend


  pyspark-base-3.5:
    image: local/jupyter-pyspark-base:3.5.9

    build:
      context: "https://github.com/jupyter/docker-stacks.git#main:images/pyspark-notebook"
      args:
        spark_version: "3.5.9"
        hadoop_version: "3"
        openjdk_version: "17"

    profiles:
      - build_only

  jupyter-spark-3.5:
    image: local/jupyter-pyspark:3.5.9

    build:
      context: jupyter_spark_3_5
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: local/jupyter-pyspark-base:3.5.9
        SCALA_VERSION: "2.12.20"
      secrets:
        - GITHUB_TOKEN

    container_name: jupyter_spark_3_5_9

    environment:
      - JUPYTER_ENABLE_LAB=yes
      - IPYTHONDIR=/home/jovyan/work/.ipython
      - JUPYTER_SERVICE_NAME=jupyter-spark-3.5
      - TRAEFIK_HTTP_PORT=${TRAEFIK_HTTP_PORT:-8080}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AWS_REGION=${AWS_REGION:-}
      - DATABRICKS_AUTH_STORAGE=plaintext
      - AWS_CONFIG_FILE=/home/jovyan/.aws/config
      - AWS_LOGIN_CACHE_DIRECTORY=/home/jovyan/.aws/login/cache

    profiles:
      - jupyter_spark_3_5

    restart: unless-stopped

    security_opt:
      - label=disable

    labels:
      - traefik.enable=true
      - traefik.http.routers.jupyter-spark-3-5.rule=Host(`jupyter-spark-3-5.localhost`)
      - traefik.http.routers.jupyter-spark-3-5.entrypoints=web
      - traefik.http.routers.jupyter-spark-3-5.priority=100
      - traefik.http.routers.jupyter-spark-3-5.service=jupyter-spark-3-5
      - traefik.http.services.jupyter-spark-3-5.loadbalancer.server.port=8888
      - traefik.http.routers.jupyter-spark-3-5-spark-ui.rule=Host(`jupyter-spark-3-5.localhost`) && PathPrefix(`/webui`)
      - traefik.http.routers.jupyter-spark-3-5-spark-ui.entrypoints=web
      - traefik.http.routers.jupyter-spark-3-5-spark-ui.priority=300
      - traefik.http.routers.jupyter-spark-3-5-spark-ui.service=jupyter-spark-3-5-spark-ui
      - traefik.http.routers.jupyter-spark-3-5-spark-ui.middlewares=jupyter-spark-3-5-spark-ui-strip-prefix
      - traefik.http.routers.jupyter-spark-3-5-spark-pages.rule=Host(`jupyter-spark-3-5.localhost`) && (PathPrefix(`/jobs`) || PathPrefix(`/stages`) || PathPrefix(`/storage`) || PathPrefix(`/environment`) || PathPrefix(`/executors`) || PathPrefix(`/SQL`) || PathPrefix(`/api/v1`))
      - traefik.http.routers.jupyter-spark-3-5-spark-pages.entrypoints=web
      - traefik.http.routers.jupyter-spark-3-5-spark-pages.priority=300
      - traefik.http.routers.jupyter-spark-3-5-spark-pages.middlewares=jupyter-spark-3-5-spark-pages-redirect
      - traefik.http.routers.jupyter-spark-3-5-spark-pages.service=noop@internal
      - traefik.http.routers.jupyter-spark-3-5-spark-prefixed-static.rule=Host(`jupyter-spark-3-5.localhost`) && PathRegexp(`^/webui/static/(bootstrap|vis-timeline|webui|timeline-view|sorttable|jquery-3\\.5\\.1|initialize-tooltips|table|log-view|scroll-button|dataTables|d3|dagre-d3|graphlib-dot|jquery\\.(blockUI|cookies|dataTables|mustache)|spark-dag-viz|spark-logo).*`)
      - traefik.http.routers.jupyter-spark-3-5-spark-prefixed-static.entrypoints=web
      - traefik.http.routers.jupyter-spark-3-5-spark-prefixed-static.priority=400
      - traefik.http.routers.jupyter-spark-3-5-spark-prefixed-static.service=jupyter-spark-3-5-spark-ui
      - traefik.http.routers.jupyter-spark-3-5-spark-prefixed-static.middlewares=jupyter-spark-3-5-spark-ui-strip-prefix
      - traefik.http.routers.jupyter-spark-3-5-spark-static.rule=Host(`jupyter-spark-3-5.localhost`) && PathRegexp(`^/static/(bootstrap|vis-timeline|webui|timeline-view|sorttable|jquery-3\\.5\\.1|initialize-tooltips|table|log-view|scroll-button|dataTables|d3|dagre-d3|graphlib-dot|jquery\\.(blockUI|cookies|dataTables|mustache)|spark-dag-viz|spark-logo).*`)
      - traefik.http.routers.jupyter-spark-3-5-spark-static.entrypoints=web
      - traefik.http.routers.jupyter-spark-3-5-spark-static.priority=300
      - traefik.http.routers.jupyter-spark-3-5-spark-static.middlewares=jupyter-spark-3-5-spark-static-redirect
      - traefik.http.routers.jupyter-spark-3-5-spark-static.service=noop@internal
      - traefik.http.services.jupyter-spark-3-5-spark-ui.loadbalancer.server.port=4042
      - traefik.http.middlewares.jupyter-spark-3-5-spark-pages-redirect.redirectregex.regex=^http://([^/]+)/(jobs|stages|storage|environment|executors|SQL|api/v1)(.*)
      - traefik.http.middlewares.jupyter-spark-3-5-spark-pages-redirect.redirectregex.replacement=http://$${1}/webui/$${2}$${3}
      - traefik.http.middlewares.jupyter-spark-3-5-spark-pages-redirect.redirectregex.permanent=false
      - traefik.http.middlewares.jupyter-spark-3-5-spark-static-redirect.redirectregex.regex=^http://([^/]+)/static/(.*)
      - traefik.http.middlewares.jupyter-spark-3-5-spark-static-redirect.redirectregex.replacement=http://$${1}/webui/static/$${2}
      - traefik.http.middlewares.jupyter-spark-3-5-spark-static-redirect.redirectregex.permanent=false
      - traefik.http.middlewares.jupyter-spark-3-5-spark-ui-strip-prefix.stripprefix.prefixes=/webui
      - traefik.http.routers.spark-connect-3-5.rule=Host(`spark-connect-3-5.localhost`)
      - traefik.http.routers.spark-connect-3-5.entrypoints=web
      - traefik.http.routers.spark-connect-3-5.service=spark-connect-3-5
      - traefik.http.services.spark-connect-3-5.loadbalancer.server.port=15002
      - traefik.http.services.spark-connect-3-5.loadbalancer.server.scheme=h2c

    command:
      - bash
      - -lc
      - |
        set -o errexit -o pipefail
        if /home/jovyan/.local/bin/mise ls --missing --no-header | grep -q .; then
          /home/jovyan/.local/bin/mise install
        fi
        eval "$(/home/jovyan/.local/bin/mise activate bash)"
        exec start-notebook.py --ServerApp.token=''

    volumes:
      - ../../notebooks/jupyter:/home/jovyan/work
      - "${HOME}/.databrickscfg:/home/jovyan/.databrickscfg:rw"
      - "${HOME}/.databricks:/home/jovyan/.databricks:rw"
      # AWS CLI
      - ${HOME}/.aws:/home/jovyan/.aws:ro
      - ${HOME}/.aws/login/cache:/home/jovyan/.aws/login/cache:rw
      - ./Volumes:/Volumes

    networks:
      - frontend
      - backend

  pyspark-base-4.1:
    image: local/jupyter-pyspark-base:4.1.3

    build:
      #context: "https://github.com/jupyter/docker-stacks.git#main:images/pyspark-notebook"
      context: "https://github.com/jupyter/docker-stacks.git#26da4ae66471c8b6714150db241f17d61a1e269a:images/pyspark-notebook"
      args:
        spark_version: "4.1.3"
        hadoop_version: "3"
        openjdk_version: "21"

    profiles:
      - build_only

  pyspark-base-4.2:
    image: local/jupyter-pyspark-base:4.2.0

    build:
      context: "https://github.com/jupyter/docker-stacks.git#main:images/pyspark-notebook"
      args:
        spark_version: "4.2.0"
        hadoop_version: "3"
        openjdk_version: "21"

    profiles:
      - build_only

