  jupyter-glue-5:
    build:
      context: jupyter_spark_glue_5
      dockerfile: Dockerfile
      args:
        SCALA_VERSION: "2.12.18"
        GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    environment:
      - JUPYTER_SERVICE_NAME=jupyter-glue-5
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AWS_REGION=${AWS_REGION:-}
    profiles:
      - jupyter_spark_glue_5
    restart: unless-stopped
    security_opt:
      - label=disable
    entrypoint: []
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --ServerApp.token=
      - --ServerApp.password=
      - --notebook-dir=/home/hadoop/work
    volumes:
      - ../notebooks/jupyter:/home/hadoop/work
      # Docker socket
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - traefik.enable=true
      - traefik.http.routers.jupyter-glue-5.rule=Host(`jupyter-glue-5.localhost`)
      - traefik.http.routers.jupyter-glue-5.entrypoints=web
      - traefik.http.services.jupyter-glue-5.loadbalancer.server.port=8888
    networks:
