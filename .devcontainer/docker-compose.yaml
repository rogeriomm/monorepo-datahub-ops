      - traefik.http.routers.jupyter-spark-4-1-spark-ui.service=jupyter-spark-4-1-spark-ui
      - traefik.http.routers.jupyter-spark-4-1-spark-ui.middlewares=jupyter-spark-4-1-spark-ui-strip-prefix
      - traefik.http.routers.jupyter-spark-4-1-spark-pages.rule=Host(`jupyter-spark-4-1.localhost`) && (PathPrefix(`/jobs`) || PathPrefix(`/stages`) || PathPrefix(`/storage`) || PathPrefix(`/environment`) || PathPrefix(`/executors`) || PathPrefix(`/SQL`) || PathPrefix(`/api/v1`))
      - traefik.http.routers.jupyter-spark-4-1-spark-pages.entrypoints=web
      - traefik.http.routers.jupyter-spark-4-1-spark-pages.priority=300
      - traefik.http.routers.jupyter-spark-4-1-spark-pages.middlewares=jupyter-spark-4-1-spark-pages-redirect
      - traefik.http.routers.jupyter-spark-4-1-spark-pages.service=noop@internal
      - traefik.http.routers.jupyter-spark-4-1-spark-prefixed-static.rule=Host(`jupyter-spark-4-1.localhost`) && PathRegexp(`^/webui/static/(bootstrap|vis-timeline|webui|timeline-view|sorttable|jquery-3\\.5\\.1|initialize-tooltips|table|log-view|scroll-button|dataTables|d3|dagre-d3|graphlib-dot|jquery\\.(blockUI|cookies|dataTables|mustache)|spark-dag-viz|spark-logo).*`)
      - traefik.http.routers.jupyter-spark-4-1-spark-prefixed-static.entrypoints=web
      - traefik.http.routers.jupyter-spark-4-1-spark-prefixed-static.priority=400
      - traefik.http.routers.jupyter-spark-4-1-spark-prefixed-static.service=jupyter-spark-4-1-spark-ui
      - traefik.http.routers.jupyter-spark-4-1-spark-prefixed-static.middlewares=jupyter-spark-4-1-spark-ui-strip-prefix
      - traefik.http.routers.jupyter-spark-4-1-spark-static.rule=Host(`jupyter-spark-4-1.localhost`) && PathRegexp(`^/static/(bootstrap|vis-timeline|webui|timeline-view|sorttable|jquery-3\\.5\\.1|initialize-tooltips|table|log-view|scroll-button|dataTables|d3|dagre-d3|graphlib-dot|jquery\\.(blockUI|cookies|dataTables|mustache)|spark-dag-viz|spark-logo).*`)
