# https://containers.dev/guide/dockerfile
services:
  traefik:
    image: traefik:v3.7.6
    container_name: traefik
    profiles:
      - jupyter_spark_3_5
      - jupyter_spark_4_1
      - jupyter_spark_glue_5
      - kafka
      - seaweedfs
      - zeppelin_0_12_1
    restart: unless-stopped
    security_opt:
      - label=disable
    command:
      - --entrypoints.web.address=:80
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --api.dashboard=true
    ports:
      - "${TRAEFIK_HTTP_PORT:-8080}:80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik-dashboard.rule=Host(`traefik.localhost`)
      - traefik.http.routers.traefik-dashboard.entrypoints=web
      - traefik.http.routers.traefik-dashboard.service=api@internal
      - traefik.http.routers.traefik-dashboard-localhost.rule=Host(`localhost`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
      - traefik.http.routers.traefik-dashboard-localhost.entrypoints=web
      - traefik.http.routers.traefik-dashboard-localhost.service=api@internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - frontend

  tools:
    build:
      context: swiss-knife-tools
      dockerfile: Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
        DOCKER_GID: 960
        GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      secrets:
        - GITHUB_TOKEN
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AWS_REGION=${AWS_REGION:-}
    container_name: tool
    restart: unless-stopped
    security_opt:
      - label=disable
    ports:
      # Java debug port
      - "5005:5005"
      # SSH server
      - "9022:22"
    # mount a local directory
    volumes:
      - ../..:/workspaces:cached
      - $HOME/data:/data:z
      # SSH configuration
      - $HOME/.ssh:/home/ubuntu/.ssh:z
      # Maven cache, Spark build
      - $HOME/.m2:/home/ubuntu/.m2:z
      # mise cache
      - $HOME/.local/share/mise:/home/ubuntu/.local/share/mise:z
      # TMUX configuration
      - $HOME/.tmux.conf:/home/ubuntu/.tmux.conf:z
      - $HOME/.tmux:/home/ubuntu/.tmux:z
      # Dot config directory
      - $HOME/.config:/home/ubuntu/.config:z
      # Docker socket
      - /var/run/docker.sock:/var/run/docker.sock
      # JetBrains crack
      - /opt/jetbrains/agent.jar:/opt/jetbrains/agent.jar:ro
    networks:
      - frontend
      - backend


  pyspark-base-3.5:
    image: local/jupyter-pyspark-base:3.5.3

    build:
      context: "https://github.com/jupyter/docker-stacks.git#main:images/pyspark-notebook"
      args:
        spark_version: "3.5.3"
        hadoop_version: "3"
        openjdk_version: "17"

    profiles:
      - build_only

  jupyter-spark-3.5:
    image: local/jupyter-pyspark:3.5.3

    build:
      context: jupyter_spark_3_5
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: local/jupyter-pyspark-base:3.5.3
        SCALA_VERSION: "2.12.20"

    container_name: jupyter-spark-3.5

    volumes:
      - ../notebooks/jupyter:/home/jovyan/work

    environment:
      - JUPYTER_ENABLE_LAB="yes"
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AWS_REGION=${AWS_REGION:-}

    profiles:
      - jupyter_spark_3_5

    labels:
      - traefik.enable=true
      - traefik.http.routers.jupyter-spark-3-5.rule=Host(`jupyter-spark-3-5.localhost`)
      - traefik.http.routers.jupyter-spark-3-5.entrypoints=web
      - traefik.http.services.jupyter-spark-3-5.loadbalancer.server.port=8888

    networks:
      - frontend

    restart: unless-stopped


  pyspark-base-4.1:
    image: local/jupyter-pyspark-base:4.1.2

    build:
      context: "https://github.com/jupyter/docker-stacks.git#main:images/pyspark-notebook"
      args:
        spark_version: "4.1.2"
        hadoop_version: "3"
        openjdk_version: "21"

    profiles:
      - build_only

  jupyter-spark-4.1:
    image: local/jupyter-pyspark:4.1.2

    build:
      context: jupyter_spark_4_1
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: local/jupyter-pyspark-base:4.1.2
        SCALA_VERSION: "2.13.17"
        GITHUB_TOKEN: "${GITHUB_TOKEN:-}"

    container_name: jupyter_spark_4_1_2

    environment:
      - JUPYTER_ENABLE_LAB=yes
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AWS_REGION=${AWS_REGION:-}

    profiles:
      - jupyter_spark_4_1

    restart: unless-stopped

    security_opt:
      - label=disable

    labels:
      - traefik.enable=true
      - traefik.http.routers.jupyter-spark-4-1.rule=Host(`jupyter-spark-4-1.localhost`)
      - traefik.http.routers.jupyter-spark-4-1.entrypoints=web
      - traefik.http.services.jupyter-spark-4-1.loadbalancer.server.port=8888

    command: start-notebook.py --ServerApp.token=''

    volumes:
      - ../notebooks/jupyter:/home/jovyan/work

    networks:
      - frontend

  jupyter-glue-5:
    build:
      context: jupyter_spark_glue_5
      dockerfile: Dockerfile
      args:
        GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AWS_REGION=${AWS_REGION:-}
    profiles:
      - jupyter_spark_glue_5
    restart: unless-stopped
    security_opt:
      - label=disable
    entrypoint: []
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --ServerApp.token=
      - --ServerApp.password=
      - --notebook-dir=/home/hadoop/work
    volumes:
      - ../notebooks/jupyter:/home/hadoop/work
    labels:
      - traefik.enable=true
      - traefik.http.routers.jupyter-glue-5.rule=Host(`jupyter-glue-5.localhost`)
      - traefik.http.routers.jupyter-glue-5.entrypoints=web
      - traefik.http.services.jupyter-glue-5.loadbalancer.server.port=8888
    networks:
      - frontend

  # https://zeppelin.apache.org/docs/0.12.1/quickstart/docker.html
  zeppelin-0.12.1:
    build:
      context: ./zeppelin
      dockerfile: Dockerfile
      args:
        GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    environment:
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    container_name: zeppelin_0_12_1
    profiles:
      - zeppelin_0_12_1
    restart: unless-stopped
    security_opt:
      - label=disable
    #ports:
    #  - "${ZEPPELIN_PORT:-6661}:8080"
    labels:
      - traefik.enable=true
      - traefik.http.routers.zeppelin.rule=Host(`zeppelin.localhost`)
      - traefik.http.routers.zeppelin.entrypoints=web
      - traefik.http.services.zeppelin.loadbalancer.server.port=8080
    volumes:
      - ../notebooks/zeppelin:/notebooks
    networks:
      - frontend

  # https://docs.localstack.cloud/aws/getting-started/installation/
  localstack:
    container_name: '${LOCALSTACK_DOCKER_NAME:-localstack-main}'
    profiles:
      - localstack
    image: localstack/localstack-pro # required for Pro
    #ports:
      #- '127.0.0.1:4566:4566' # LocalStack Gateway
      #- '127.0.0.1:4510-4559:4510-4559' # external services port range
      #- '127.0.0.1:443:443' # LocalStack HTTPS Gateway (Pro)
    environment:
      # Activate LocalStack for AWS: https://docs.localstack.cloud/getting-started/auth-token/
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?} # required for Pro
      # LocalStack configuration: https://docs.localstack.cloud/references/configuration/
      - DEBUG=${DEBUG:-0}
      - PERSISTENCE=${PERSISTENCE:-0}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - '${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack'
      - '/var/run/docker.sock:/var/run/docker.sock'
    networks:
      - frontend

  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    profiles:
      - kafka
    restart: unless-stopped
    security_opt:
      - label=disable
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - frontend

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    profiles:
      - kafka
    restart: unless-stopped
    security_opt:
      - label=disable
    depends_on:
      - kafka
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    labels:
      - traefik.enable=true
      - traefik.http.routers.kafka-ui.rule=Host(`kafka-ui.localhost`)
      - traefik.http.routers.kafka-ui.entrypoints=web
      - traefik.http.services.kafka-ui.loadbalancer.server.port=8080
    networks:
      - frontend

  seaweedfs:
    image: chrislusf/seaweedfs:4.39
    container_name: seaweedfs
    profiles:
      - seaweedfs
      - s3
    restart: unless-stopped
    security_opt:
      - label=disable
    command: server -dir=/data -filer -s3 -ip=seaweedfs -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024
    ports:
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"
    environment:
      AWS_ACCESS_KEY_ID: "${SEAWEEDFS_ACCESS_KEY_ID:-admin}"
      AWS_SECRET_ACCESS_KEY: "${SEAWEEDFS_SECRET_ACCESS_KEY:-secret}"
    volumes:
      - seaweedfs-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.seaweedfs-master.rule=Host(`seaweedfs-master.localhost`)
      - traefik.http.routers.seaweedfs-master.entrypoints=web
      - traefik.http.routers.seaweedfs-master.service=seaweedfs-master
      - traefik.http.services.seaweedfs-master.loadbalancer.server.port=9333
      - traefik.http.routers.seaweedfs-filer.rule=Host(`seaweedfs-filer.localhost`)
      - traefik.http.routers.seaweedfs-filer.entrypoints=web
      - traefik.http.routers.seaweedfs-filer.service=seaweedfs-filer
      - traefik.http.services.seaweedfs-filer.loadbalancer.server.port=8888
      - traefik.http.routers.seaweedfs-s3.rule=Host(`seaweedfs-s3.localhost`)
      - traefik.http.routers.seaweedfs-s3.entrypoints=web
      - traefik.http.routers.seaweedfs-s3.service=seaweedfs-s3
      - traefik.http.services.seaweedfs-s3.loadbalancer.server.port=8333
    networks:
      - frontend

secrets:
  GITHUB_TOKEN:
    environment: GITHUB_TOKEN

volumes:
  kafka-data:
  seaweedfs-data:

# https://docs.docker.com/compose/how-tos/networking/
networks:
  frontend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
  backend:
    internal: true   # No external connectivity
