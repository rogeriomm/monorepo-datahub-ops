    restart: unless-stopped

    security_opt:
      - label=disable

    labels:
      - traefik.enable=true
      - traefik.http.routers.jupyter-spark-4-1.rule=Host(`jupyter-spark-4-1.localhost`)
      - traefik.http.routers.jupyter-spark-4-1.entrypoints=web
      - traefik.http.routers.jupyter-spark-4-1.priority=100
      - traefik.http.routers.jupyter-spark-4-1.service=jupyter-spark-4-1
      - traefik.http.services.jupyter-spark-4-1.loadbalancer.server.port=8888
      - traefik.http.routers.jupyter-spark-4-1-spark-ui.rule=Host(`jupyter-spark-4-1.localhost`) && PathPrefix(`/webui`)
      - traefik.http.routers.jupyter-spark-4-1-spark-ui.entrypoints=web
