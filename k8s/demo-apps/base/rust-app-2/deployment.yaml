apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-rust-app-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-rust-app-2
  template:
    metadata:
      labels:
        app: sample-rust-app-2
    spec:
      containers:
        - name: sample-go-1
          image: harbor.ing.vm.pvel.worldl.xpt/main/sample-rust-app-2:0.46
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
